<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>馒头幼小衔接（植物大战僵尸版）</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" id="brandMark"></svg>
      <div class="brand-text">
        <h1>馒头幼小衔接（植物大战僵尸版）</h1>
        <div class="sub">大班小朋友专属 · 边玩边学 · 天天进步</div>
      </div>
    </div>
    <div id="sunBadge"><svg class="icon" viewBox="0 0 100 100" id="sunIcon"></svg><span id="sunCount">0</span></div>
  </header>
  <div id="layout">
    <nav id="sidebar">
      <button class="nav-btn" data-mod="home"><span class="ic">🏠</span>首页</button>
      <button class="nav-btn" data-mod="pinyin"><span class="ic">🔤</span>拼音天地</button>
      <button class="nav-btn" data-mod="math"><span class="ic">🔢</span>数学乐园</button>
      <button class="nav-btn" data-mod="time"><span class="ic">⏰</span>时间认知</button>
      <button class="nav-btn" data-mod="shapes"><span class="ic">🔷</span>几何图形</button>
      <button class="nav-btn" data-mod="english"><span class="ic">🐝</span>英语启蒙</button>
      <button class="nav-btn" data-mod="poems"><span class="ic">📖</span>古诗诵读</button>
      <button class="nav-btn" data-mod="logic"><span class="ic">🧩</span>逻辑思维</button>
      <button class="nav-btn" data-mod="attention"><span class="ic">🎯</span>专注力</button>
      <button class="nav-btn" data-mod="safety"><span class="ic">🛡️</span>安全教育</button>
      <button class="nav-btn" data-mod="write"><span class="ic">✍️</span>写字练习</button>
      <button class="nav-btn" data-mod="game"><span class="ic">🧟</span>植物大战僵尸</button>
    </nav>
    <main id="content"></main>
  </div>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
